[project]
name = "stream-analysis"
version = "0.1.0"
description = "Deterministic intraday market research and replay platform"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "sqlalchemy==2.0.50",
  "alembic==1.18.4",
  "psycopg[binary]==3.2.10",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.12.12",
  "mypy==1.17.1",
  "httpx==0.28.1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["market_analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_analysis"]
